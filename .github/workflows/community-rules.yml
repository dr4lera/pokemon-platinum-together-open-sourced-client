name: Community source rules
on:
  push:
    branches: [community-client]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dr4lera/pokemon-platinum-together-open-sourced-runtime
          ref: 3b4149ef68f8385f044f57d26b1a871ea9910a87
          path: subprojects/libntr
      - uses: actions/checkout@v4
        with:
          repository: dr4lera/pokemon-platinum-together-open-sourced-runtime-system
          ref: bc08b00f9a588a6a658fe3832d7e113f81647311
          path: subprojects/libntrsystem
      - run: python3 tests/run_community_palette.py
      - run: python3 tests/run_community_rules.py
      - run: python3 tests/run_community_learnsets.py
      - run: python3 tests/run_community_catalog.py
      - run: python3 tests/run_community_move_table.py
      - run: python3 tests/run_community_species_loaders.py
      - run: python3 tests/run_community_evolutions.py
      - run: python3 tests/run_community_species_graphics.py --archives-only
      - run: python3 tests/run_community_qa_guard.py
      - run: python3 tests/run_community_character_sprite.py
      - run: python3 tests/run_community_asset_overlay.py
      - run: python3 subprojects/libntr/tests/community_wm_test.py
      - run: python3 tests/run_community_wireless.py
      - run: python3 tests/run_community_controller.py
      - run: python3 tests/run_community_link_qa_guard.py
      - run: python3 tests/run_community_area_light.py
      - run: python3 tests/run_community_wireless_core.py
      - run: python3 tests/run_community_species_text.py
      - run: python3 tests/run_community_modern_assets.py
      - run: gcc -std=c99 -Wall -Wextra -Werror -Iinclude tests/capture_rules_core_test.c -o /tmp/capture-rules
      - run: /tmp/capture-rules
