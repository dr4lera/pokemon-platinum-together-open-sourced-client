name: Community Windows build
on:
  push:
    branches: [community-client]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-client:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: actions/checkout@v4
        with:
          repository: dr4lera/pokemon-platinum-together-open-sourced-server
          ref: 35ee5a45148e3897773019f70d454e4a44e37a3f
          path: .build-tools/community-test-backend
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git flex bison
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-arm-none-eabi-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-enet
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
      - name: Compile source client without game installation or ROM
        shell: pwsh
        env:
          PT_BUILD_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH="$env:PT_BUILD_MSYS2_ROOT\ucrt64\bin;$env:PT_BUILD_MSYS2_ROOT\usr\bin;"+$env:PATH
          $env:CC="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/gcc.exe"
          $env:CXX="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
          ./tools/community/build-win64.ps1 -Jobs 4
      - name: Check community rules
        shell: pwsh
        env:
          PT_BUILD_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH="$env:PT_BUILD_MSYS2_ROOT\ucrt64\bin;$env:PT_BUILD_MSYS2_ROOT\usr\bin;"+$env:PATH
          $env:CC="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/gcc.exe"
          $env:CXX="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
          python tests/run_community_palette.py --cc "$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/gcc.exe"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_rules.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_learnsets.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_catalog.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_move_table.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_species_loaders.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_evolutions.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_species_graphics.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_character_sprite.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_qa_guard.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_asset_overlay.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python subprojects/libntr/tests/community_wm_test.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_wireless.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_wireless_core.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_species_text.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_modern_assets.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_controller.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_link_qa_guard.py --std c++20
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_link_qa_guard.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_wireless_scan.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_stat_stages.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_comm_parser.py --engine-build build_win64
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_modern_dex.py --engine-build build_win64
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_trainer_art.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_union.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_forms.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_form_scripts.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_ability_updates.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_area_light.py --engine-build build_win64
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_fairy_moves.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python tests/run_community_emitter_mode.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          gcc -std=c99 -Wall -Wextra -Werror -Iinclude tests/capture_rules_core_test.c -o build_win64/capture-rules.exe
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ./build_win64/capture-rules.exe
      - name: Check actual native online adapter against disposable backend
        shell: pwsh
        env:
          PT_BUILD_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH="$env:PT_BUILD_MSYS2_ROOT\ucrt64\bin;$env:PT_BUILD_MSYS2_ROOT\usr\bin;"+$env:PATH
          $env:CC="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/gcc.exe"
          $env:CXX="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
          ./tests/community_online_run.ps1 -BackendRoot "$pwd/.build-tools/community-test-backend" -FixtureDirectory "$env:RUNNER_TEMP/community-online-$env:GITHUB_RUN_ID" -Compiler "$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
      - name: Check actual wireless provider against disposable backend
        shell: pwsh
        env:
          PT_BUILD_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH="$env:PT_BUILD_MSYS2_ROOT\ucrt64\bin;$env:PT_BUILD_MSYS2_ROOT\usr\bin;"+$env:PATH
          $env:CC="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/gcc.exe"
          $env:CXX="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
          ./tests/community_wireless_provider_run.ps1 -BackendRoot "$pwd/.build-tools/community-test-backend" -FixtureDirectory "$env:RUNNER_TEMP/community-wireless-$env:GITHUB_RUN_ID" -Compiler "$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
      - name: Check presentation and QA controller against disposable backend
        shell: pwsh
        env:
          PT_BUILD_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH="$env:PT_BUILD_MSYS2_ROOT\ucrt64\bin;$env:PT_BUILD_MSYS2_ROOT\usr\bin;"+$env:PATH
          $env:CC="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/gcc.exe"
          $env:CXX="$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
          ./tests/community_presentation_run.ps1 -BackendRoot "$pwd/.build-tools/community-test-backend" -FixtureDirectory "$env:RUNNER_TEMP/community-presentation-$env:GITHUB_RUN_ID" -Compiler "$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
          ./tests/community_link_qa_controller_run.ps1 -BackendRoot "$pwd/.build-tools/community-test-backend" -FixtureDirectory "$env:RUNNER_TEMP/community-qa-controller-$env:GITHUB_RUN_ID" -Compiler "$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
      - name: Check bounded trainer art downloads against disposable backend
        shell: pwsh
        env:
          PT_BUILD_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH="$env:PT_BUILD_MSYS2_ROOT\ucrt64\bin;$env:PT_BUILD_MSYS2_ROOT\usr\bin;"+$env:PATH
          ./tests/community_trainer_art_download_run.ps1 -BackendRoot "$pwd/.build-tools/community-test-backend" -FixtureDirectory "$env:RUNNER_TEMP/community-trainer-art-$env:GITHUB_RUN_ID" -Compiler "$env:PT_BUILD_MSYS2_ROOT/ucrt64/bin/g++.exe"
